name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 1. web build with base '/' -> the Android debug APK
      - name: Build Android APK
        run: |
          npm run build
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../abyssos.apk
      # 2. web build with base '/abyssos/' -> the site, with the APK next to it
      - name: Build site
        run: npm run build && cp abyssos.apk dist/abyssos.apk
        env:
          BASE_PATH: /abyssos/
      # 3. Skotos, the other game in this repository (skotos/, its own app): its web build, co-op over Supabase
      #    (skotos/docs/coop/supabase.md), in the site's skotos/ folder. The URL and the publishable key are public (they
      #    are in the page). A failure here leaves Abyssos's own site to deploy as ever, without skotos/.
      - name: Build Skotos
        continue-on-error: true
        working-directory: skotos
        env:
          VITE_SUPABASE_URL: https://twabjiurbqhqmxzcokqj.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_A4_6wAoE8hvOBtIWBVp2Tw_vrry83yH
        run: |
          npm ci --no-audit --no-fund
          npm run build:web
          cp -r dist-web ../dist/skotos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
